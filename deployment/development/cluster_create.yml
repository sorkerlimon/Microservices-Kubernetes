kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: helm-dev-cluster1

nodes:
  - role: control-plane
    extraPortMappings:
      # Expose ingress controller HTTP/HTTPS
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP

