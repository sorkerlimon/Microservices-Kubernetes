apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sorkerlimon/Microservices-Kubernetes.git
    targetRevision: aws_kub
    path: deployment/development
    directory:
      recurse: true
      exclude: cluster_create.yml
  destination:
    server: https://kubernetes.default.svc
    namespace: dev-project
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      
