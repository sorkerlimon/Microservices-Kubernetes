
sudo apt update
sudo apt install certbot python3-certbot-nginx
sudo certbot certonly --nginx -d prizebond-stage.technobdapis.com

sudo systemctl enable certbot.timer
sudo systemctl start certbot.timer
sudo certbot renew --dry-run

/etc/letsencrypt/live/prizebond-stage.technobdapis.com/fullchain.pem
/etc/letsencrypt/live/prizebond-stage.technobdapis.com/privkey.pem

sudo rm /etc/nginx/sites-enabled/default
sudo rm /etc/nginx/sites-available/default

cd /etc/nginx/sites-available && sudo vi prizebond.technobdapis.com



server {
    listen 80;
    server_name prizebond-stage.technobdapis.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name prizebond-stage.technobdapis.com;



    ssl_certificate /etc/letsencrypt/live/prizebond-stage.technobdapis.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prizebond-stage.technobdapis.com/privkey.pem;


    root /var/www/wordpress;
    client_max_body_size 100M;
    # Gzip Configuration
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_buffers 16 8k;
    gzip_proxied any;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-javascript
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        font/truetype
        font/ttf
        font/woff
        font/woff2
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/javascript
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy
        text/xml;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.(?!.*SV1)";
    gzip_static on;


    # Block known bots
    if ($http_user_agent ~* (bot|spider|slurp|teoma|archive|track|snoopy|java|wget|curl|comodo|dirbuster|nikto|nmap|sqlmap|wpscan|acunetix|netsparker|httrack|harvest|frontpage|python|perl|ruby|tcl|download|extract|stripper|sucker|ninja|clshttp|webpirates|npbot|libwww|msnbot|scspider|bsdseek|bingbot|yandexbot|baiduspider|exabot|facebot|ia_archiver|siteexplorer|mail.ru|mj12bot|ahrefsbot|semrushbot|seznambot|vindalu|ccbot|gigabot|dotbot|linkdexbot|blexbot|ezooms|femtocleaner|morfeus|webmeup|jetbot|yacybot|sogou|spbot|turnitinbot|heritrix|findlinks|dataprovider|httrack|webzip|webcollage|webcopier|webstripper|webwhacker|webzip|webcollage|webcopier|webstripper|webwhacker|webzip|webcollage|webcopier|webstripper|webwhacker|webzip|webcollage|webcopier|webstripper|webwhacker)) {
    return 403;
    }



    # Static files location - Cookie free and cached
    location ~* \.(jpg|jpeg|png|gif|ico|webp|css|js|pdf|txt|woff|woff2|ttf|eot|svg)$ {
        # Remove cookies
        proxy_cookie_path / "/; HTTPOnly; Secure; SameSite=Strict";
        add_header Set-Cookie "" always;
        proxy_set_header Cookie "";

        # Cache headers
        expires 1y;
        add_header Cache-Control "public, no-transform, must-revalidate, max-age=31536000";

        # Gzip specific headers
        add_header Vary Accept-Encoding;

        try_files $uri $uri/ @proxy;
        access_log off;
        log_not_found off;
    }

    # HTML and XML files
    location ~* \.(html|xml)$ {
        expires 30m;
        add_header Cache-Control "public, no-transform, must-revalidate, proxy-revalidate";
        add_header Vary Accept-Encoding;
        try_files $uri $uri/ @proxy;
    }

    # JSON files
    location ~* \.(json)$ {
        expires 1h;
        add_header Cache-Control "public, no-transform, must-revalidate, proxy-revalidate";
        add_header Vary Accept-Encoding;
        try_files $uri $uri/ @proxy;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Proxy to Apache
    location / {
        proxy_pass http://localhost:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Enable gzip for proxied requests
        proxy_set_header Accept-Encoding gzip;

        # Cache control for dynamic content
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location @proxy {
        proxy_pass http://localhost:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding gzip;
    }

    # Deny access to .htaccess files
    location ~ /\.ht {
        deny all;
    }
    location = /xmlrpc.php {
        deny all;
    }

    location ~* ^/wp-cron.php$ {
        allow 127.0.0.1; # Allow only internal cron jobs
        deny all;         # Block external access
    }


    location ~* ^/wp-includes/ {
        deny all;
    }

    location ~* wp-config.php {
        deny all;
    }

}




sudo ln -s /etc/nginx/sites-available/prizebond.technobdapis.com /etc/nginx/sites-enabled/prizebond.technobdapis.com

sudo chown -R $USER:$USER /home/ubuntu/prizebond-stage.technobdapis.com

sudo ln -s /etc/nginx/conf.d/prizebond-stage.technobdapis.com /etc/nginx/sites-enabled/prizebond-stage.technobdapis.com