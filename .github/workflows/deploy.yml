name: Basic Docker CI

on:
  push:
    branches:
      - flask-kube
    paths:
      - 'application/**'
      - '.github/workflows/main.yml'
  pull_request:
    branches:
      - basic
    paths:
      - 'application/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate datetime tag
        id: datetime
        run: |
          echo "tag=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: mdlimon/basic-app
          tags: |
            type=raw,value=${{ steps.datetime.outputs.tag }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./application
          file: ./application/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Configure Git
        run: |
          git config --global user.name "${{ secrets.GH_USERNAME }}"
          git config --global user.email "${{ secrets.GH_USERNAME }}@users.noreply.github.com"

      - name: Update deployment YAML with new tag
        run: |
          sed -i "s|image: mdlimon/basic-app:.*|image: mdlimon/basic-app:${{ steps.datetime.outputs.tag }}|g" Deploy/2_basic_deployment.yaml

      - name: Commit and push changes
        run: |
          git add Deploy/2_basic_deployment.yaml
          git diff --staged --quiet || git commit -m "Update basic-app image tag to ${{ steps.datetime.outputs.tag }}"
          git push https://${{ secrets.GH_USERNAME }}:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref }}
