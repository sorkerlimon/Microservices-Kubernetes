apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: kub-project
  labels:
    app: mysql
spec:
  ports:
  - port: 3306
    targetPort: 3306
    name: mysql
  selector:
    app: mysql
  clusterIP: None
---
# Headless service for stable DNS entries of StatefulSet members
apiVersion: v1
kind: Service
metadata:
  name: mysql-read
  namespace: kub-project
  labels:
    app: mysql
spec:
  ports:
  - port: 3306
    targetPort: 3306
    name: mysql
  selector:
    app: mysql
  # This is a regular ClusterIP service that will route to all MySQL instances
  # for read operations, enabling read scalability
