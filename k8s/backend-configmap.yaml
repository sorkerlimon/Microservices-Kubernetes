apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  # Backend application settings
  APP_ENV: "production"
  LOG_LEVEL: "info"
  MYSQL_HOST: "mysql-service"
  MYSQL_DATABASE: "appdb"
  MYSQL_USER: "user"
  # Frontend service information for CORS
  FRONTEND_URL: "http://frontend-service:3000"
  # API configuration
  API_PREFIX: "/api/v1"
  DOCS_URL: "/docs"
  REDOC_URL: "/redoc"
