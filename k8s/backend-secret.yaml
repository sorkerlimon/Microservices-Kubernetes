apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
type: Opaque
stringData:
  # Database credentials
  MYSQL_PASSWORD: "password"
  # JWT Secret for authentication (in a real environment, use a stronger secret)
  JWT_SECRET: "your-super-secret-jwt-key-for-authentication"
  # API Keys (if needed)
  API_KEY: "development-api-key"
