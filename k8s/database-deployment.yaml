apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: kub-project
spec:
  selector:
    matchLabels:
      app: mysql
  serviceName: "mysql"
  replicas: 2
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: mysql
    spec:
      terminationGracePeriodSeconds: 10
      volumes:
      - name: config-volume
        configMap:
          name: mysql-config
      containers:
      - image: mysql:8.0
        name: mysql
        command:
        - bash
        - "-c"
        - |
          # Install hostname command
          microdnf install -y hostname || apt-get update && apt-get install -y hostname || true
          
          # Get pod name from environment
          POD_NAME=${HOSTNAME}
          echo "Pod name: $POD_NAME"
          
          # Determine if this is primary or replica based on pod name
          if [[ "$POD_NAME" == "mysql-0" ]]; then
            echo "Configuring as primary MySQL server"
            cp /mnt/config-map/primary.cnf /etc/mysql/conf.d/
            export MYSQL_REPLICATION_MODE="master"
            
            # Start MySQL
            exec docker-entrypoint.sh mysqld
          else
            echo "Configuring as replica MySQL server"
            cp /mnt/config-map/replica.cnf /etc/mysql/conf.d/
            export MYSQL_REPLICATION_MODE="slave"
            
            # Wait for primary to be ready
            echo "Waiting for primary MySQL (mysql-0.mysql) to be ready..."
            until (getent hosts mysql-0.mysql || nslookup mysql-0.mysql) > /dev/null 2>&1; do
              echo "Waiting for DNS resolution of mysql-0.mysql..."
              sleep 5
            done
            
            until mysql -h mysql-0.mysql -u root -p"${MYSQL_ROOT_PASSWORD}" -e "SELECT 1" > /dev/null 2>&1; do
              echo "Waiting for primary MySQL to be ready..."
              sleep 5
            done
            
            echo "Primary MySQL is ready. Configuring replication."
            export MYSQL_MASTER_HOST="mysql-0.mysql"
            
            # Start MySQL
            exec docker-entrypoint.sh mysqld
          fi
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kub-project-secrets
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: kub-project-config
              key: MYSQL_DATABASE
        - name: MYSQL_USER
          valueFrom:
            configMapKeyRef:
              name: kub-project-config
              key: MYSQL_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kub-project-secrets
              key: MYSQL_PASSWORD
        # Add replication configuration
        - name: MYSQL_REPLICATION_MODE
          value: "master"
          # Use StatefulSet ordinal index to determine master/slave
          # mysql-0 will be master, mysql-1 will be slave
        - name: MYSQL_REPLICATION_USER
          value: "repl_user"
        - name: MYSQL_REPLICATION_PASSWORD
          value: "repl_password"
        ports:
        - containerPort: 3306
          name: mysql
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
        - name: config-volume
          mountPath: /mnt/config-map
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - -u
            - kubuser
            - -pkubpassword
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - -u
            - kubuser
            - -pkubpassword
          initialDelaySeconds: 30
          periodSeconds: 10
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
