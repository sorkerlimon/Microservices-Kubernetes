<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App Kubernetes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2em;
        }
        
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        
        input[type="text"] {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus {
            border-color: #667eea;
        }
        
        button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .weather-info {
            display: none;
            text-align: center;
        }
        
        .weather-info.active {
            display: block;
        }
        
        .city-name {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 10px;
        }
        
        .temperature {
            font-size: 4em;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
        }
        
        .description {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 30px;
            text-transform: capitalize;
        }
        
        .weather-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto;
        }
        
        .details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 30px;
        }
        
        .detail-item {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
        }
        
        .detail-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }
        
        .detail-value {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
        
        .error.active {
            display: block;
        }
        
        .loading {
            text-align: center;
            display: none;
            color: #667eea;
            font-size: 1.1em;
        }
        
        .loading.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌤️ Weather App</h1>
        
        <form id="weatherForm" class="search-box">
            <input 
                type="text" 
                id="cityInput" 
                name="city" 
                placeholder="Enter city (e.g., Dhaka, Bangladesh)" 
                required
            >
            <button type="submit">Search</button>
        </form>
        
        <div class="loading" id="loading">Loading weather data...</div>
        
        <div class="error" id="error"></div>
        
        <div class="weather-info" id="weatherInfo">
            <div class="city-name" id="cityName"></div>
            <img class="weather-icon" id="weatherIcon" src="" alt="Weather Icon">
            <div class="temperature" id="temperature"></div>
            <div class="description" id="description"></div>
            
            <div class="details">
                <div class="detail-item">
                    <div class="detail-label">Feels Like</div>
                    <div class="detail-value" id="feelsLike"></div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Humidity</div>
                    <div class="detail-value" id="humidity"></div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Pressure</div>
                    <div class="detail-value" id="pressure"></div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Wind Speed</div>
                    <div class="detail-value" id="windSpeed"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        document.getElementById('weatherForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const cityInput = document.getElementById('cityInput').value;
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const weatherInfo = document.getElementById('weatherInfo');
            
            // Reset UI
            loading.classList.add('active');
            error.classList.remove('active');
            weatherInfo.classList.remove('active');
            
            try {
                const formData = new FormData();
                formData.append('city', cityInput);
                
                const response = await fetch('/weather', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Failed to fetch weather data');
                }
                
                // Display weather data
                document.getElementById('cityName').textContent = `${data.city}, ${data.country}`;
                document.getElementById('temperature').textContent = `${Math.round(data.temperature)}°C`;
                document.getElementById('description').textContent = data.description;
                document.getElementById('weatherIcon').src = `https://openweathermap.org/img/wn/${data.icon}@2x.png`;
                document.getElementById('feelsLike').textContent = `${Math.round(data.feels_like)}°C`;
                document.getElementById('humidity').textContent = `${data.humidity}%`;
                document.getElementById('pressure').textContent = `${data.pressure} hPa`;
                document.getElementById('windSpeed').textContent = `${data.wind_speed} m/s`;
                
                weatherInfo.classList.add('active');
                
            } catch (err) {
                error.textContent = err.message;
                error.classList.add('active');
            } finally {
                loading.classList.remove('active');
            }
        });
    </script>
</body>
</html>
